name: Daily sign in Baha

on:
  workflow_dispatch

jobs:
  bahasign:
    runs-on: ubuntu-latest
    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: setup python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: install requests library
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: run the sign-in script
        env:
          USER_ACCOUNT: ${{ secrets.ACCOUNT }}
          USER_PASSWORD: ${{ secrets.PASSWORD }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bahasign.py

      - name: keep action alive (commit changes)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README
          git commit -m "Auto Sign-in Log: $(date '+%Y/%m/%d %H:%M:%S')" || exit 0
          git push
